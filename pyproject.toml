[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "calltap"
version = "0.1.0"
description = "Dual-track voice call recorder and cloud uploader for browser-based AI voice agents"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "httpx>=0.28",
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
    "pyjwt[crypto]>=2.10",
    "uvicorn[standard]>=0.32",
    "websockets>=14.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "ruff>=0.8",
]

[project.scripts]
calltap = "calltap.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["calltap"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"
