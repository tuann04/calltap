services:
  neko:
    build:
      context: ./docker/neko
    restart: unless-stopped
    shm_size: "2gb"
    dns:
      - 1.1.1.1
      - 8.8.8.8
    env_file:
      # TURN credentials rotated daily by /usr/local/bin/turn-rotate.sh.
      - path: /var/lib/calltap/turn.env
        required: false
    ports:
      # Bind web UI to localhost so Tailscale Serve or Caddy terminates HTTPS in front.
      - "127.0.0.1:8080:8080"
      # Single UDP + TCP mux port for WebRTC.
      - "${NEKO_WEBRTC_UDPMUX:-52000}:${NEKO_WEBRTC_UDPMUX:-52000}/udp"
      - "${NEKO_WEBRTC_TCPMUX:-52000}:${NEKO_WEBRTC_TCPMUX:-52000}/tcp"
    environment:
      NEKO_SERVER_BIND: ":8080"
      NEKO_DESKTOP_SCREEN: "${NEKO_DESKTOP_SCREEN:-1008x1712@30}"
      CHROME_SCALE_FACTOR: "${CHROME_SCALE_FACTOR:-2}"
      NEKO_CAPTURE_MICROPHONE_ENABLED: "true"
      NEKO_CAPTURE_MICROPHONE_DEVICE: "audio_input"
      NEKO_CAPTURE_AUDIO_DEVICE: "audio_output.monitor"
      NEKO_MEMBER_MULTIUSER_USER_PASSWORD: "${NEKO_USER_PASSWORD:-change-me-user}"
      NEKO_MEMBER_MULTIUSER_ADMIN_PASSWORD: "${NEKO_ADMIN_PASSWORD:-change-me-admin}"
      # Cloudflare Access OIDC login (passkeys). Passwords remain as fallback.
      NEKO_MEMBER_PROVIDER: "${NEKO_MEMBER_PROVIDER:-multiuser}"
      NEKO_SESSION_COOKIE_ENABLED: "${NEKO_SESSION_COOKIE_ENABLED:-false}"
      NEKO_SESSION_IMPLICIT_HOSTING: "${NEKO_SESSION_IMPLICIT_HOSTING:-true}"
      NEKO_DESKTOP_INPUT_ENABLED: "${NEKO_DESKTOP_INPUT_ENABLED:-true}"
      NEKO_MEMBER_OAUTH_ENABLED: "${NEKO_OAUTH_ENABLED:-false}"
      NEKO_MEMBER_OAUTH_NAME: "Cloudflare Access"
      NEKO_MEMBER_OAUTH_ISSUER_URL: "${NEKO_OAUTH_ISSUER_URL:-}"
      NEKO_MEMBER_OAUTH_CLIENT_ID: "${NEKO_OAUTH_CLIENT_ID:-}"
      NEKO_MEMBER_OAUTH_CLIENT_SECRET: "${NEKO_OAUTH_CLIENT_SECRET:-}"
      NEKO_MEMBER_OAUTH_REDIRECT_URL: "${NEKO_OAUTH_REDIRECT_URL:-}"
      NEKO_MEMBER_OAUTH_ADMIN_EMAILS: "${NEKO_OAUTH_ADMIN_EMAILS:-}"
      NEKO_MEMBER_OAUTH_USER_EMAILS: "${NEKO_OAUTH_USER_EMAILS:-}"
      NEKO_MEMBER_OAUTH_AUTO_REDIRECT: "${NEKO_OAUTH_AUTO_REDIRECT:-false}"
      NEKO_WEBRTC_UDPMUX: "${NEKO_WEBRTC_UDPMUX:-52000}"
      NEKO_WEBRTC_TCPMUX: "${NEKO_WEBRTC_TCPMUX:-52000}"
      NEKO_WEBRTC_NAT1TO1: "${NEKO_WEBRTC_NAT1TO1:-}"
      # ICE servers (e.g. Cloudflare Realtime TURN) require a full ICE agent.
      NEKO_WEBRTC_ICELITE: "false"
      # JSON arrays, rotated daily by deploy/cloudflare/turn-rotate.timer.
      NEKO_WEBRTC_ICESERVERS_FRONTEND: "${NEKO_TURN_FRONTEND:-[]}"
      NEKO_WEBRTC_ICESERVERS_BACKEND: "${NEKO_TURN_BACKEND:-[]}"
    volumes:
      - chrome_profile:/home/neko/.config/calltap-chrome
      - pulse_sock:/var/run/pulse

  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    # On the compose network so ingress hostnames (neko, calltap) resolve.
    command: tunnel run
    environment:
      TUNNEL_TOKEN: "${CLOUDFLARED_TOKEN:-}"
    depends_on:
      - neko
      - calltap

  calltap:
    build:
      context: .
      dockerfile: docker/calltap/Dockerfile
    restart: unless-stopped
    dns:
      - 1.1.1.1
      - 8.8.8.8
    depends_on:
      - neko
    ports:
      - "127.0.0.1:8090:8090"
    env_file:
      - path: .env
        required: false
    environment:
      CALLTAP_PULSE_SERVER: "unix:/var/run/pulse/pulseaudio.socket"
      CALLTAP_CDP_URL: "http://neko:9222"
    volumes:
      - pulse_sock:/var/run/pulse
      - ./data:/data
      - ./rclone:/config/rclone

volumes:
  chrome_profile:
  pulse_sock:
